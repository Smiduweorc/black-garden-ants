name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Templates are in sync and consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Regenerates templates/ and fails if the committed output differs, so
      # an edit to src/ can never ship without a rebuild.
      - name: Consistency checks
        run: ./check.sh

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck the generated scripts
        run: |
          shellcheck build.sh check.sh
          shellcheck templates/*/release.sh templates/*/scripts/*.sh

  smoke-go:
    name: Smoke test (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [go-make, go-just]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false
      - name: lint / test / build
        working-directory: templates/${{ matrix.template }}
        run: |
          scripts/tasks.sh lint
          scripts/tasks.sh test
          scripts/tasks.sh build
      - name: commit-msg accepts and rejects through go tool commitlint
        working-directory: templates/${{ matrix.template }}
        run: |
          printf 'feat: add the widget\n' > "$RUNNER_TEMP/good"
          printf 'not conventional\n' > "$RUNNER_TEMP/bad"
          scripts/commit-msg.sh "$RUNNER_TEMP/good"
          ! scripts/commit-msg.sh "$RUNNER_TEMP/bad"

  smoke-ts:
    name: Smoke test (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [ts-npm, ts-make]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: templates/${{ matrix.template }}/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: templates/${{ matrix.template }}
        run: bun install
      - name: lint / test / build / pack check
        working-directory: templates/${{ matrix.template }}
        run: |
          scripts/tasks.sh lint
          scripts/tasks.sh test
          scripts/tasks.sh build
          scripts/pack-check.sh

  smoke-bare:
    name: Smoke test (bare-make)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: lint / test / build
        working-directory: templates/bare-make
        run: |
          scripts/tasks.sh lint
          scripts/tasks.sh test
          scripts/tasks.sh build
