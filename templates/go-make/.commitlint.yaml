# Commit message rules for conventionalcommit/commitlint (Go):
# https://github.com/conventionalcommit/commitlint
# Run by scripts/commit-msg.sh from the commit-msg hook and in CI.
# type-enum must stay in sync with the groups in cliff.toml.
min-version: v0.12.0
formatter: default
rules:
- header-min-length
- header-max-length
- body-max-line-length
- footer-max-line-length
- type-enum
severity:
  default: error
  rules: {}
settings:
  body-max-line-length:
    argument: 100
    flags: {}
  footer-max-line-length:
    argument: 100
    flags: {}
  header-max-length:
    argument: 100
    flags: {}
  header-min-length:
    argument: 10
    flags: {}
  type-enum:
    argument:
    - feat
    - fix
    - docs
    - style
    - refactor
    - perf
    - test
    - build
    - ci
    - chore
    - revert
    flags: {}
disable-default-ignores: false
ignores: []
